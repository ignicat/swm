[package]
name = "swm-api"
version = "0.1.0"
edition = "2024"
description = "Stable Rust client API for swm (simple window manager)"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
swm-ipc = { version = "0.1.0", path = "../swm-ipc" }
serde = { version = "1", features = ["derive"] }
wayland-client = { version = "0.31.14", optional = true }
wayland-server = { version = "0.31.13", optional = true }
wayland-scanner = { version = "0.31.9", optional = true }
wayland-backend = { version = "0.3.15", optional = true }

[features]
default = []
wayland-client = ["dep:wayland-client", "dep:wayland-scanner", "dep:wayland-backend"]
wayland-server = ["dep:wayland-server", "dep:wayland-scanner", "dep:wayland-backend"]
test-support = []
