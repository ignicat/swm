name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache-key: release
      - name: Build release binaries
        run: cargo build --locked --release --workspace
      - name: Verify built binaries
        run: |
          target/release/swm --version
          target/release/swmctl --help
          test -x target/release/xdg-desktop-portal-swm
      - name: Package release archive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          stage="swm-v${version}-linux-x86_64"
          mkdir -p "dist/${stage}/bin" "dist/${stage}/examples"
          install -Dm755 target/release/swm "dist/${stage}/bin/swm"
          install -Dm755 target/release/swmctl "dist/${stage}/bin/swmctl"
          install -Dm755 target/release/xdg-desktop-portal-swm "dist/${stage}/bin/xdg-desktop-portal-swm"
          install -Dm755 packaging/wayland-sessions/swm-session "dist/${stage}/bin/swm-session"
          cp -r packaging "dist/${stage}/packaging"
          cp examples/swm.rune "dist/${stage}/examples/swm.rune"
          cp README.md LICENSE "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          (cd dist && sha256sum "${stage}.tar.gz" > SHA256SUMS.txt)
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          notes=$(printf '%s\n' \
            'Initial release of **swm** (simple window manager).' \
            '' \
            'Archive contents (built on Ubuntu 26.04 x86_64 with default features: systemd, dbus, xwayland, winit):' \
            '- bin/swm, bin/swmctl, bin/xdg-desktop-portal-swm, bin/swm-session' \
            '- packaging/ (Wayland session, portals, D-Bus, systemd/dinit/runit/s6 units)' \
            '- examples/swm.rune' \
            '' \
            'Runtime dependencies: DRM/KMS, GBM, EGL, OpenGL ES, libinput, libseat, libdisplay-info 0.3, libxkbcommon, pipewire, wayland, Xwayland, libsystemd. For other distros or init systems (dinit, minimal TTY-only), build from source or the Nix flake.')
          if gh release view "${TAG_NAME}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/*.tar.gz dist/SHA256SUMS.txt --repo "${REPO}" --clobber
          else
            gh release create "${TAG_NAME}" dist/*.tar.gz dist/SHA256SUMS.txt --repo "${REPO}" --title "swm ${TAG_NAME}" --notes "${notes}"
          fi
