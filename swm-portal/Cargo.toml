[package]
name = "swm-portal"
version = "0.1.0"
edition = "2024"
description = "Native xdg-desktop-portal ScreenCast backend for swm"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "xdg-desktop-portal-swm"
path = "src/main.rs"

[dependencies]
blocking = "1.6"
eventline = "0.9.0"
gbm = "0.18"
swm-ipc = { version = "0.1.0", path = "../swm-ipc" }
libc = "0.2"
pollster = "0.4"
pipewire = { version = "0.10", features = ["v0_3_34"] }
zbus = "5.16"
